<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Kids Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #fff;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        p.subtitle { font-size: 1.2rem; opacity: 0.9; margin-bottom: 40px; }
        .games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 900px;
        }
        .card {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: #fff;
            text-align: center;
            transition: transform 0.2s, background 0.2s;
            backdrop-filter: blur(6px);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .card:hover { transform: translateY(-6px) scale(1.03); background: rgba(255,255,255,0.28); }
        .card .emoji { font-size: 4rem; display: block; margin-bottom: 16px; }
        .card .name { font-size: 1.4rem; font-weight: bold; }
        .card .desc { font-size: 0.95rem; opacity: 0.85; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>🎮 Kids Games</h1>
    <p class="subtitle">Pick a game to play!</p>
    <div class="games">
        <!-- Add a new <a class="card"> per game folder -->
        <a class="card" href="bubble-burst/index.html">
            <span class="emoji">🫧</span>
            <span class="name">Bubble Burst</span>
            <span class="desc">Pop the bubbles!</span>
        </a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🫧 Bubble Burst Game | اببل برسٹ گیم</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 20%, #0f3460 40%, #533483 60%, #e94560 80%, #ff6b6b 100%);
            overflow: hidden;
        }

        #game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 10% 90%, rgba(255,255,255,0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(255,107,107,0.2) 0%, transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(83,52,131,0.3) 0%, transparent 50%);
            animation: sky-pulse 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sky-pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
            pointer-events: none;
        }

        .star::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            border-radius: 50%;
        }

        .star::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 15px;
            background: linear-gradient(180deg, transparent, rgba(255,255,255,0.8), transparent);
            border-radius: 50%;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(20px);
        }

        .floating-shape {
            position: absolute;
            pointer-events: none;
            opacity: 0.6;
        }

        .heart-shape {
            width: 30px;
            height: 30px;
            background: rgba(255,107,107,0.4);
            transform: rotate(-45deg);
            animation: float-heart 15s ease-in-out infinite;
        }

        .heart-shape::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: rgba(255,107,107,0.4);
            border-radius: 50%;
            top: -15px;
            left: 0;
        }

        .heart-shape::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: rgba(255,107,107,0.4);
            border-radius: 50%;
            top: 0;
            left: 15px;
        }

        @keyframes float-heart {
            0%, 100% { transform: rotate(-45deg) translateY(0); }
            50% { transform: rotate(-45deg) translateY(-30px); }
        }

        .spiral-shape {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(78,205,196,0.5);
            border-radius: 50%;
            animation: spiral-spin 10s linear infinite;
        }

        @keyframes spiral-spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.5); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .wave-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(90deg,
                rgba(255,107,107,0.3),
                rgba(78,205,196,0.3),
                rgba(69,183,209,0.3),
                rgba(150,206,180,0.3),
                rgba(255,234,167,0.3),
                rgba(255,107,107,0.3));
            background-size: 200% 100%;
            animation: wave-flow 8s linear infinite;
            pointer-events: none;
        }

        @keyframes wave-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .bubble {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: float-up linear forwards;
            cursor: pointer;
            user-select: none;
        }

        .bubble::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 12px;
            width: 12px;
            height: 8px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .bubble.color-1 {
            background: radial-gradient(circle at 35% 35%, #FF69B4, #FF1493, #DB7093);
            box-shadow: 0 0 25px rgba(255,20,147,0.8), 0 0 50px rgba(255,105,180,0.4), inset 0 0 20px rgba(255,255,255,0.3);
        }
        .bubble.color-2 {
            background: radial-gradient(circle at 35% 35%, #00CED1, #20B2AA, #008B8B);
            box-shadow: 0 0 25px rgba(0,206,209,0.8), 0 0 50px rgba(32,178,170,0.4), inset 0 0 20px rgba(255,255,255,0.3);
        }
        .bubble.color-3 {
            background: radial-gradient(circle at 35% 35%, #FFA500, #FF8C00, #FF4500);
            box-shadow: 0 0 25px rgba(255,165,0,0.8), 0 0 50px rgba(255,140,0,0.4), inset 0 0 20px rgba(255,255,255,0.3);
        }
        .bubble.color-4 {
            background: radial-gradient(circle at 35% 35%, #9370DB, #8A2BE2, #9932CC);
            box-shadow: 0 0 25px rgba(147,112,219,0.8), 0 0 50px rgba(138,43,226,0.4), inset 0 0 20px rgba(255,255,255,0.3);
        }
        .bubble.color-5 {
            background: radial-gradient(circle at 35% 35%, #32CD32, #228B22, #006400);
            box-shadow: 0 0 25px rgba(50,205,50,0.8), 0 0 50px rgba(34,139,34,0.4), inset 0 0 20px rgba(255,255,255,0.3);
        }
        .bubble.color-6 {
            background: radial-gradient(circle at 35% 35%, #1E90FF, #4169E1, #0000CD);
            box-shadow: 0 0 25px rgba(30,144,255,0.8), 0 0 50px rgba(65,105,225,0.4), inset 0 0 20px rgba(255,255,255,0.3);
        }
        .bubble.color-7 {
            background: radial-gradient(circle at 35% 35%, #FF4500, #DC143C, #B22222);
            box-shadow: 0 0 25px rgba(255,69,0,0.8), 0 0 50px rgba(220,20,60,0.4), inset 0 0 20px rgba(255,255,255,0.3);
        }
        .bubble.color-8 {
            background: radial-gradient(circle at 35% 35%, #FFD700, #FFA500, #FF8C00);
            box-shadow: 0 0 25px rgba(255,215,0,0.8), 0 0 50px rgba(255,165,0,0.4), inset 0 0 20px rgba(255,255,255,0.3);
        }
        .bubble.color-9 {
            background: radial-gradient(circle at 35% 35%, #FF1493, #C71585, #DB7093);
            box-shadow: 0 0 25px rgba(255,20,147,0.8), 0 0 50px rgba(199,21,133,0.4), inset 0 0 20px rgba(255,255,255,0.3);
        }
        .bubble.color-10 {
            background: radial-gradient(circle at 35% 35%, #00FA9A, #3CB371, #2E8B57);
            box-shadow: 0 0 25px rgba(0,250,154,0.8), 0 0 50px rgba(60,179,113,0.4), inset 0 0 20px rgba(255,255,255,0.3);
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 15px;
            height: 15px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
        }

        @keyframes float-up {
            from {
                bottom: -70px;
            }
            to {
                bottom: 110vh;
            }
        }

        .burst {
            animation: burst-explode 0.4s ease-out forwards;
        }

        @keyframes burst-explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        .burst-ring {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 4px solid white;
            border-radius: 50%;
            pointer-events: none;
            animation: ring-expand 0.5s ease-out forwards;
            box-shadow: 0 0 30px currentColor;
        }

        @keyframes ring-expand {
            0% {
                transform: scale(1);
                opacity: 1;
                border-width: 4px;
            }
            100% {
                transform: scale(4);
                opacity: 0;
                border-width: 1px;
            }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .particle.circle {
            width: 10px;
            height: 10px;
            animation: particle-circle 0.8s ease-out forwards;
        }

        .particle.star {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 15px solid;
            animation: particle-star 1s ease-out forwards;
        }

        .particle.heart {
            width: 12px;
            height: 12px;
            background: #FF6B6B;
            transform: rotate(-45deg);
            animation: particle-heart 1s ease-out forwards;
        }

        .particle.heart::before {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: #FF6B6B;
            border-radius: 50%;
            top: -6px;
            left: 0;
        }

        .particle.heart::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: #FF6B6B;
            border-radius: 50%;
            top: 0;
            left: 6px;
        }

        @keyframes particle-circle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        @keyframes particle-star {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) rotate(360deg) scale(0);
                opacity: 0;
            }
        }

        @keyframes particle-heart {
            0% {
                transform: rotate(-45deg) translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: rotate(-45deg) translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle-burst 0.6s ease-out forwards;
        }

        @keyframes sparkle-burst {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            50% {
                transform: scale(2);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            pointer-events: none;
            animation: confetti-fall 1.2s ease-out forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) rotate(720deg);
                opacity: 0;
            }
        }

        #score-board {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #764ba2;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 100;
        }

        @media (max-width: 768px) {
            #score-board {
                font-size: 18px;
                padding: 10px 15px;
                top: 60px;
            }
            #lang-toggle {
                top: 10px;
                font-size: 14px;
                padding: 8px 15px;
            }
            #pause-btn {
                top: 10px;
                right: 10px;
                font-size: 16px;
                padding: 10px 20px;
            }
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #start-screen h1 {
            font-size: 48px;
            color: white;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }

        #start-screen p {
            font-size: 24px;
            color: white;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
        }

        #start-btn {
            padding: 20px 50px;
            font-size: 28px;
            background: #FFD700;
            color: #764ba2;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 35px rgba(0,0,0,0.4);
        }

        #game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 300;
        }

        #game-over h1 {
            color: #FFD700;
            font-size: 52px;
            margin-bottom: 20px;
        }

        #game-over p {
            color: white;
            font-size: 32px;
            margin-bottom: 30px;
        }

        #restart-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: #FFD700;
            color: #764ba2;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }

        #pause-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 30px;
            font-size: 20px;
            background: #FF6B6B;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 100;
            transition: transform 0.2s;
        }

        #pause-btn:hover {
            transform: scale(1.1);
        }

        #pause-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 250;
        }

        #pause-screen h1 {
            color: #FFD700;
            font-size: 52px;
            margin-bottom: 30px;
        }

        #resume-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }

        .paused .bubble {
            animation-play-state: paused;
        }

        .missed {
            color: red !important;
        }

        #language-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .lang-btn {
            padding: 15px 35px;
            font-size: 22px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 3px solid white;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #FFD700;
            color: #764ba2;
            border-color: #FFD700;
            transform: scale(1.1);
        }

        #lang-toggle {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 25px;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            color: #764ba2;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 100;
            transition: transform 0.2s;
        }

        #lang-toggle:hover {
            transform: translateX(-50%) scale(1.05);
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <div id="language-selector">
            <button class="lang-btn" data-lang="ur">اردو</button>
            <button class="lang-btn" data-lang="en">English</button>
        </div>
        <h1 data-translate="title">🫧 اببل برسٹ گیم 🫧</h1>
        <p data-translate="instructions">جب اببل اوپر آئے، تو صرف اسی کو کلید دباؤ!<br>Score: 10 se badhao!</p>
        <button id="start-btn" data-translate="start">🎮 شروع کرو!</button>
    </div>

    <div id="game-container"></div>

    <div id="score-board">
        <span data-translate="scoreLabel">⭐ Score:</span> <span id="score">0</span> | <span data-translate="livesLabel">❤️ Lives:</span> <span id="lives">5</span>
    </div>

    <button id="lang-toggle" data-translate="langToggle">🔄 EN</button>

    <button id="pause-btn" data-translate="pause">⏸️ روکو</button>

    <div id="pause-screen">
        <h1 data-translate="paused">⏸️ روک دیا گیا</h1>
        <button id="resume-btn" data-translate="resume">▶️ جاری کرو</button>
    </div>

    <div id="game-over">
        <h1 data-translate="gameOver">🎮 ختم!</h1>
        <p data-translate="finalScore">تمہارا سکور: <span id="final-score">0</span></p>
        <button id="restart-btn" data-translate="restart">🔄 دوبارہ کھیلو</button>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const finalScoreElement = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over');
        const pauseScreen = document.getElementById('pause-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const langToggle = document.getElementById('lang-toggle');
        const langBtns = document.querySelectorAll('.lang-btn');

        let score = 0;
        let lives = 5;
        let gameRunning = false;
        let isPaused = false;
        let bubbleInterval;
        let bubbles = [];
        let currentLang = 'ur';

        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

        const translations = {
            ur: {
                title: '🫧 اببل برسٹ گیم 🫧',
                instructions: 'جب اببل اوپر آئے، تو وہی کلید دباؤ!<br>ہر آبلے پر 10 نمبر!',
                start: '🎮 شروع کرو!',
                scoreLabel: '⭐ نمبر:',
                livesLabel: '❤️ جان:',
                pause: '⏸️ روکو',
                paused: '⏸️ روک دیا گیا',
                resume: '▶️ جاری کرو',
                gameOver: '🎮 ختم!',
                finalScore: 'تمہارا نمبر: ',
                restart: '🔄 دوبارہ کھیلو',
                langToggle: '🔄 EN'
            },
            en: {
                title: '🫧 Bubble Burst Game 🫧',
                instructions: 'Press the matching letter key to pop the bubble!<br>10 points per bubble!',
                start: '🎮 Start!',
                scoreLabel: '⭐ Score:',
                livesLabel: '❤️ Lives:',
                pause: '⏸️ Pause',
                paused: '⏸️ Paused',
                resume: '▶️ Resume',
                gameOver: '🎮 Game Over!',
                finalScore: 'Your Score: ',
                restart: '🔄 Play Again',
                langToggle: '🔄 اردو'
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (t[key]) {
                    if (key === 'finalScore') {
                        el.innerHTML = t[key] + '<span id="final-score">' + score + '</span>';
                    } else {
                        el.innerHTML = t[key];
                    }
                }
            });

            langBtns.forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                }
            });

            if (lang === 'en') {
                document.body.style.fontFamily = "'Comic Sans MS', cursive, sans-serif";
            } else {
                document.body.style.fontFamily = "'Noto Nastaliq Urdu', 'Comic Sans MS', cursive, sans-serif";
            }
        }

        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setLanguage(btn.getAttribute('data-lang'));
            });
        });

        langToggle.addEventListener('click', () => {
            setLanguage(currentLang === 'ur' ? 'en' : 'ur');
        });

        function createBubble() {
            if (!gameRunning) return;

            const bubble = document.createElement('div');
            const colorClass = 'color-' + (Math.floor(Math.random() * 10) + 1);
            bubble.className = 'bubble ' + colorClass;
            const letter = letters[Math.floor(Math.random() * letters.length)];
            bubble.textContent = letter;
            bubble.dataset.letter = letter;

            const randomX = Math.random() * (window.innerWidth - 75);
            bubble.style.left = randomX + 'px';

            const duration = 5 + Math.random() * 5;
            bubble.style.animationDuration = duration + 's';

            container.appendChild(bubble);
            bubbles.push(bubble);

            bubble.addEventListener('animationend', () => {
                if (bubble.parentNode && !bubble.classList.contains('burst')) {
                    bubble.remove();
                    bubbles = bubbles.filter(b => b !== bubble);
                    lives--;
                    livesElement.textContent = lives;

                    if (lives <= 0) {
                        endGame();
                    }
                }
            });
        }

        function burstBubble(letter) {
            const bubble = bubbles.find(b => b.dataset.letter === letter && !b.classList.contains('burst'));
            if (bubble) {
                const rect = bubble.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                createParticles(centerX, centerY);

                bubble.classList.add('burst');
                score += 10;
                scoreElement.textContent = score;

                setTimeout(() => {
                    if (bubble.parentNode) {
                        bubble.remove();
                    }
                    bubbles = bubbles.filter(b => b !== bubble);
                }, 300);
            }
        }

        function createParticles(x, y) {
            const colors = ['#FF6B9D', '#4ECDC4', '#FFA500', '#9C59B6', '#2ECC71', '#3498DB', '#E74C3C', '#F1C40F', '#FF69B4', '#00CED1'];

            // Create expanding ring
            const ring = document.createElement('div');
            ring.className = 'burst-ring';
            ring.style.left = (x - 30) + 'px';
            ring.style.top = (y - 30) + 'px';
            ring.style.color = colors[Math.floor(Math.random() * colors.length)];
            container.appendChild(ring);

            setTimeout(() => {
                if (ring.parentNode) ring.remove();
            }, 500);

            // Create circle particles
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle circle';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';

                const angle = (i / 8) * Math.PI * 2;
                const distance = 60 + Math.random() * 40;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');

                container.appendChild(particle);

                setTimeout(() => {
                    if (particle.parentNode) particle.remove();
                }, 800);
            }

            // Create star particles
            for (let i = 0; i < 4; i++) {
                const star = document.createElement('div');
                star.className = 'particle star';
                star.style.borderBottomColor = colors[Math.floor(Math.random() * colors.length)];
                star.style.left = x + 'px';
                star.style.top = y + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 30;
                star.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                star.style.setProperty('--ty', Math.sin(angle) * distance + 'px');

                container.appendChild(star);

                setTimeout(() => {
                    if (star.parentNode) star.remove();
                }, 1000);
            }

            // Create heart particles
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('div');
                heart.className = 'particle heart';
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 20;
                heart.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                heart.style.setProperty('--ty', Math.sin(angle) * distance + 'px');

                container.appendChild(heart);

                setTimeout(() => {
                    if (heart.parentNode) heart.remove();
                }, 1000);
            }

            // Create sparkles
            for (let i = 0; i < 10; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 40;
                sparkle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                sparkle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');

                container.appendChild(sparkle);

                setTimeout(() => {
                    if (sparkle.parentNode) sparkle.remove();
                }, 600);
            }

            // Create confetti
            for (let i = 0; i < 6; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = 70 + Math.random() * 50;
                confetti.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                confetti.style.setProperty('--ty', Math.sin(angle) * distance + 'px');

                container.appendChild(confetti);

                setTimeout(() => {
                    if (confetti.parentNode) confetti.remove();
                }, 1200);
            }
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            container.innerHTML = '';
            score = 0;
            lives = 5;
            bubbles = [];
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            gameRunning = true;

            createBackgroundElements();
            bubbleInterval = setInterval(createBubble, 1500);
        }

        function createBackgroundElements() {
            // Create stars
            for (let i = 0; i < 30; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 50 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }

            // Create clouds
            for (let i = 0; i < 5; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.width = (100 + Math.random() * 150) + 'px';
                cloud.style.height = (50 + Math.random() * 50) + 'px';
                cloud.style.left = Math.random() * 100 + '%';
                cloud.style.top = Math.random() * 60 + '%';
                cloud.style.animation = `float-bg ${15 + Math.random() * 10}s infinite linear`;
                container.appendChild(cloud);
            }

            // Create floating hearts
            for (let i = 0; i < 6; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-shape heart-shape';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 70 + '%';
                heart.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(heart);
            }

            // Create spirals
            for (let i = 0; i < 4; i++) {
                const spiral = document.createElement('div');
                spiral.className = 'floating-shape spiral-shape';
                spiral.style.left = Math.random() * 100 + '%';
                spiral.style.top = Math.random() * 80 + '%';
                spiral.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(spiral);
            }

            // Create wave effect at bottom
            const wave = document.createElement('div');
            wave.className = 'wave-bg';
            container.appendChild(wave);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(bubbleInterval);
            gameOverScreen.style.display = 'flex';

            const finalScoreText = document.querySelector('#game-over p');
            finalScoreText.innerHTML = translations[currentLang].finalScore + score;

            bubbles.forEach(b => b.remove());
            bubbles = [];
        }

        function pauseGame() {
            if (!gameRunning || isPaused) return;
            isPaused = true;
            clearInterval(bubbleInterval);
            container.classList.add('paused');
            pauseScreen.style.display = 'flex';
            pauseBtn.style.display = 'none';
        }

        function resumeGame() {
            if (!isPaused) return;
            isPaused = false;
            container.classList.remove('paused');
            pauseScreen.style.display = 'none';
            pauseBtn.style.display = 'block';
            bubbleInterval = setInterval(createBubble, 1500);
        }

        document.addEventListener('keydown', (e) => {
            if (!gameRunning || isPaused) return;

            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                pauseGame();
                return;
            }

            const key = e.key.toUpperCase();
            if (letters.includes(key)) {
                burstBubble(key);
            }
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', pauseGame);
        resumeBtn.addEventListener('click', resumeGame);

        // Initialize language
        setLanguage('ur');
    </script>
</body>
</html>
